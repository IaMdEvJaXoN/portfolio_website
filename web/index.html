  <!-- PRE-LOADER STYLES (VANTABLACK + HARDWARE TRACE) -->
  <style>
    /* 1. Force the background to Vantablack immediately */
    body {
      background-color: #000000;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }

    /* 2. Center everything inside the loading wrapper */
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 3. The Terminal Text */
    .boot-text {
      color: #555555;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      /* Tighter margin for stacked text */
      text-align: center;
    }

    .boot-text.last-line {
      margin-bottom: 24px;
      /* Larger gap before the trace loader */
    }

    .cursor {
      color: #00e5ff;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* 4. The Hardware Trace */
    .trace-container {
      width: 240px;
      height: 1px;
      background-color: #111111;
    }

    .trace-bar {
      height: 100%;
      background-color: #00e5ff;
      width: 0%;
      animation: traceLoad 2s cubic-bezier(0.19, 1, 0.22, 1) infinite;
    }

    @keyframes traceLoad {
      0% {
        width: 0%;
        margin-left: 0;
      }

      50% {
        width: 100%;
        margin-left: 0;
      }

      100% {
        width: 0%;
        margin-left: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- THE LOADING UI -->
  <div id="loading-indicator">
    <div class="boot-text">
      Booting.......................
    </div>
    <div class="boot-text last-line">
      > Over-engineering a simple Firestore read... (I swear it worked on localhost)<span class="cursor">_</span>
    </div>
    <div class="trace-container">
      <div class="trace-bar"></div>
    </div>
  </div>

    FLUTTER BOOTSTRAP

</body>
